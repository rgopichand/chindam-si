<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chindam</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--line:rgba(255,255,255,.3)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Poppins,system-ui,sans-serif;
  /* Replaced Unsplash image with your local asset name */
  background:#1f3b2d url("26340640.jpg") center/cover fixed;
  display:flex;flex-direction:column;min-height:100vh;
}
/* Removed the body::before dark fading background element entirely */

main{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 16px;
}
.card{
  max-width:620px;
  width:100%;
  text-align:center;
  /* Removed glass backgrounds, backdrop filters, and borders */
  /* Adjusted margin-top negatively to pull the element further up the page */
  margin-top: -140px; 
  animation:rise .9s ease-out both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

.soon{
  display:inline-block;
  padding:4px 14px;
  border:1px solid var(--line);
  border-radius:20px;
  font-size:14px;
  letter-spacing:2px;
  text-transform:uppercase;
  background:rgba(0,0,0,.35);
  color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,0.4);
}

footer{
  text-align:center;
  padding:18px 16px;
  font-size:14px;
  background:rgba(255,255,255,.45);
  backdrop-filter:blur(6px);
  /* Changed overall footer content color to black */
  color:#000;
}
footer small{
  font-weight:500;
  opacity:.85;
}
</style>
</head>
<body>
<main>
  <div class="card">
    <span class="soon">Site coming soon</span>
  </div>
</main>

<footer>© <span id="yr"></span> Chindam.SI · Visitors: <span id="vc">…</span><br>
<small>This site logs visitor IP addresses for basic analytics.</small></footer>

<script>
document.getElementById("yr").textContent = new Date().getFullYear();
(async()=>{
  const API="https://script.google.com/macros/s/AKfycbwmtmxj2MdOXGudfQLnpw8beCOkWugsuvPyuC3oWXVd8eBkcDqkmhjrdEEnQQlmqW31/exec";
  let ip="";
  try{ip=(await (await fetch("https://api.ipify.org?format=json")).json()).ip}catch(e){}
  const q=new URLSearchParams({ip,page:location.pathname,ref:document.referrer,ua:navigator.userAgent});
  try{document.getElementById("vc").textContent=(await (await fetch(API+"?"+q)).json()).count}catch(e){}
})();
</script>
</body>
</html>
