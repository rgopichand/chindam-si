<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chindam</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root{--glass:rgba(255,255,255,.14);--line:rgba(255,255,255,.3);--text:#fff;--accent:#9be7c4}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:Poppins,system-ui,sans-serif;color:var(--text);
  /* Replaced the external URL with your local image file path */
  background:#1f3b2d url("26340640.jpg") center/cover fixed;
  display:flex;flex-direction:column;min-height:100vh;
}
body::before{content:"";position:fixed;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.55));z-index:-1}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{
  max-width:620px;width:100%;text-align:center;padding:48px 32px;border-radius:20px;
  background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 20px 50px rgba(0,0,0,.35);animation:rise .9s ease-out both;
}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px;font-weight:700;letter-spacing:.5px}
.wave{display:inline-block;animation:wave 2s infinite;transform-origin:70% 70%}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%{transform:rotate(-8deg)}}
p{font-weight:300;font-size:18px;line-height:1.6;margin:0 0 10px}
.soon{display:inline-block;margin:14px 0 26px;padding:4px 14px;border:1px solid var(--line);border-radius:20px;font-size:14px;letter-spacing:2px;text-transform:uppercase}
.btn{display:inline-block;padding:12px 24px;border-radius:30px;background:var(--accent);color:#123;font-weight:500;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
footer{text-align:center;padding:18px 16px;font-size:14px;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
footer small{opacity:.75}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>What's up <span class="wave">👋</span></h1>
    <p>Hope you're doing well, and thanks for visiting the page.</p>
    <span class="soon">Site coming soon</span><br>
    <a class="btn" href="https://psych.ucsb.edu/undergraduate-overview" target="_blank" rel="noopener">Visit UCSB Undergraduate Overview</a>
  </div>
</main>

<footer>© <span id="yr"></span> Chindam.SI · Visitors: <span id="vc">…</span><br>
<small>This site logs visitor IP addresses for basic analytics.</small></footer>

<script>
document.getElementById("yr").textContent = new Date().getFullYear();
(async()=>{
  const API="https://script.google.com/macros/s/AKfycbwmtmxj2MdOXGudfQLnpw8beCOkWugsuvPyuC3oWXVd8eBkcDqkmhjrdEEnQQlmqW31/exec";
  let ip="";
  try{ip=(await (await fetch("https://api.ipify.org?format=json")).json()).ip}catch(e){}
  const q=new URLSearchParams({ip,page:location.pathname,ref:document.referrer,ua:navigator.userAgent});
  try{document.getElementById("vc").textContent=(await (await fetch(API+"?"+q)).json()).count}catch(e){}
})();
</script>
</body>
</html>
