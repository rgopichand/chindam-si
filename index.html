<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chindam</title>
</head>
<body>
  <h1>What's up.... What's up....</h1>
  <p>Hope you're doing well, and thanks for visiting the page</p>
  <p>Site coming soon.</p>
  <a href="https://psych.ucsb.edu/undergraduate-overview">Visit UCSB Undergraduate Overview!</a>

  <footer>© <span id="yr"></span> Chindam.SI | Visitors: <span id="vc">…</span><br>
  <small>This site logs visitor IP addresses for basic analytics.</small></footer>

<script>
document.getElementById("yr").textContent = new Date().getFullYear();
(async()=>{
  const API="https://script.google.com/macros/s/AKfycbxDalo779MdfW4NjTlfWdFf4_ROkQScPhovG7eU3zF8fqFHMR9gofrhLxkSPmCiRgEi/exec";
  let ip="";
  try{ip=(await (await fetch("https://api.ipify.org?format=json")).json()).ip}catch(e){}
  const q=new URLSearchParams({ip,page:location.pathname,ref:document.referrer,ua:navigator.userAgent});
  try{document.getElementById("vc").textContent=(await (await fetch(API+"?"+q)).json()).count}catch(e){console.log(e)}
})();
</script>
</body>
</html>
